<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlantCare — Generador de iconos</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f8f6;color:#1f2937;margin:0;padding:24px;line-height:1.5}
    h1{color:#388E3C;font-size:1.4rem}
    p{max-width:640px}
    .grid{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px}
    .item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .item canvas{display:block;margin:0 auto 10px;border-radius:8px;background:#fff;width:120px;height:120px;image-rendering:auto}
    .item small{display:block;color:#6b7280;margin-bottom:8px}
    button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:8px 14px;background:#4CAF50;color:#fff;cursor:pointer}
    button:hover{background:#388E3C}
    #all{margin-top:20px;padding:10px 18px}
    code{background:#eef2ee;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>🌿 Generador de iconos de PlantCare</h1>
  <p>
    Esta página dibuja los iconos de la app con <code>&lt;canvas&gt;</code> y te permite
    descargarlos como PNG. Guarda los cuatro archivos dentro de la carpeta
    <code>icons/</code> del proyecto, conservando sus nombres.
  </p>
  <p><button id="all">⬇️ Descargar todos</button></p>

  <div class="grid" id="grid"></div>

  <script>
    /* ================================================================
       Dibujo del motivo de PlantCare en un canvas.
       Mismo diseño que icon.svg: gota blanca + hojita sobre fondo verde.
       - "size": lado del icono en píxeles.
       - "maskable": si es true, el fondo ocupa todo el lienzo (sin esquinas
         redondeadas) y el dibujo se reduce a la "zona segura" central para
         que no se recorte en Android/iOS.
       ================================================================ */
    function drawIcon(ctx, size, maskable) {
      ctx.clearRect(0, 0, size, size);

      // ---- Fondo verde ----
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, "#4CAF50");
      grad.addColorStop(1, "#388E3C");
      ctx.fillStyle = grad;

      if (maskable) {
        // Fondo a sangre completa (se recortará con la forma del sistema)
        ctx.fillRect(0, 0, size, size);
      } else {
        roundRect(ctx, 0, 0, size, size, size * 0.22);
        ctx.fill();
      }

      // El dibujo se define sobre una rejilla de 512; lo escalamos al tamaño.
      // En maskable dejamos más margen (contenido dentro del ~78% central).
      ctx.save();
      const scale = size / 512;
      if (maskable) {
        ctx.translate(size / 2, size / 2);
        ctx.scale(0.78, 0.78);
        ctx.translate(-size / 2, -size / 2);
      }
      ctx.scale(scale, scale);

      // ---- Gota de agua (blanca) ----
      ctx.beginPath();
      ctx.moveTo(256, 104);
      ctx.bezierCurveTo(256, 104, 150, 232, 150, 318);
      ctx.arc(256, 318, 106, Math.PI, 0, true); // semicírculo inferior
      ctx.bezierCurveTo(362, 232, 256, 104, 256, 104);
      ctx.closePath();
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // ---- Brillo interior sutil ----
      ctx.beginPath();
      ctx.moveTo(214, 300);
      ctx.bezierCurveTo(196, 340, 206, 356, 238, 370);
      ctx.strokeStyle = "rgba(76,175,80,0.35)";
      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.stroke();

      // ---- Hojita verde ----
      ctx.beginPath();
      ctx.moveTo(256, 150);
      ctx.bezierCurveTo(282, 116, 326, 110, 352, 120);
      ctx.bezierCurveTo(358, 154, 334, 190, 294, 194);
      ctx.bezierCurveTo(280, 178, 268, 164, 256, 150);
      ctx.closePath();
      ctx.fillStyle = "#4CAF50";
      ctx.fill();

      ctx.restore();
    }

    // Rectángulo con esquinas redondeadas (compatibilidad amplia)
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Lista de iconos a generar: nombre de archivo, tamaño y si es maskable.
    const ICONS = [
      { file: "apple-touch-icon.png", size: 180, maskable: true  }, // iOS rellena transparencias
      { file: "icon-192.png",         size: 192, maskable: false },
      { file: "icon-512.png",         size: 512, maskable: false },
      { file: "icon-512-maskable.png", size: 512, maskable: true },
    ];

    const grid = document.getElementById("grid");
    const canvases = [];

    ICONS.forEach((spec) => {
      const item = document.createElement("div");
      item.className = "item";

      const canvas = document.createElement("canvas");
      canvas.width = spec.size;
      canvas.height = spec.size;
      drawIcon(canvas.getContext("2d"), spec.size, spec.maskable);

      const label = document.createElement("small");
      label.textContent = `${spec.file} (${spec.size}×${spec.size})`;

      const btn = document.createElement("button");
      btn.textContent = "⬇️ Descargar";
      btn.addEventListener("click", () => download(canvas, spec.file));

      item.append(canvas, label, btn);
      grid.appendChild(item);
      canvases.push({ canvas, file: spec.file });
    });

    function download(canvas, file) {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = file;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }, "image/png");
    }

    document.getElementById("all").addEventListener("click", () => {
      // Pequeño retardo entre descargas para que el navegador no las bloquee
      canvases.forEach((c, i) => setTimeout(() => download(c.canvas, c.file), i * 350));
    });
  </script>
</body>
</html>
